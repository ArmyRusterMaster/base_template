# Оркестратор: шаги вынесены в reusable workflows этого же коммита.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    permissions:
      contents: write
    uses: ./.github/workflows/fmt.yaml

  clippy:
    uses: ./.github/workflows/clippy.yaml

  audit:
    uses: ./.github/workflows/audit.yaml

  test:
    needs: [fmt, clippy]
    uses: ./.github/workflows/test.yaml

  build-release:
    needs: test
    uses: ./.github/workflows/build-release.yaml

  e2e:
    needs: build-release
    uses: ./.github/workflows/e2e.yaml

  docker:
    needs: build-release
    uses: ./.github/workflows/docker.yaml

  smoke:
    needs: docker
    uses: ./.github/workflows/smoke.yaml

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [smoke, e2e, audit]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yaml

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/release.yaml
