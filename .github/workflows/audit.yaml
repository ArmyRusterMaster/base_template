# Аудит зависимостей — RustSec Advisory DB (переиспользуемый workflow).
name: audit

on:
  workflow_call: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-audit
        run: cargo binstall -y cargo-audit || cargo install cargo-audit --locked
      - name: Audit dependencies (RustSec Advisory DB)
        run: cargo audit
