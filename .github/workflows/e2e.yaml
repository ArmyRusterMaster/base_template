# E2E (Playwright, chromium) из артефакта релиза (переиспользуемый workflow).
name: e2e

on:
  workflow_call: {}

env:
  BASE_URL: http://127.0.0.1:3000

jobs:
  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release
      - name: Install npm deps
        run: npm ci
        working-directory: end2end
      - name: Install Playwright browser
        # В CI гоняем только chromium: остальные движки остаются доступны локально
        # (`npx playwright test` без --project).
        run: npx playwright install --with-deps chromium
        working-directory: end2end
      - name: Start server
        run: |
          chmod +x base_template
          APP_SERVER_HOST=0.0.0.0 ./base_template > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              echo "✅ Сервер готов (попытка $i)"
              break
            fi
            sleep 1
          done
      - name: Run E2E tests
        run: npx playwright test --project=chromium
        working-directory: end2end
      - name: Server log on failure
        if: failure()
        run: cat server.log || true
