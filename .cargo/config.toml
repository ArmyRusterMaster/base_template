[build]
# Пустая строка ОТКЛЮЧАЕТ rustc-wrapper из глобального ~/.cargo/config.toml.
# Причина: sccache 0.17 падает с "failed to spawn rustc.exe" на web-sys
# (гигантская командная строка компилятора на Windows).
rustc-wrapper = ""

# Machine-specific флаги (target-cpu=native, выбор линкера вроде -fuse-ld=lld)
# сознательно НЕ задаются в шаблоне:
#   * `-fuse-ld=lld` не поддерживается MSVC-линкером (warning LNK4044 в каждой
#     сборке под Windows);
#   * `target-cpu=native` привязывает бинарь к конкретной машине — для шаблона
#     важно одинаково воспроизводимое поведение локально и в CI.
# Оптимизации под конкретное железо разработчик задаёт в своём глобальном
# ~/.cargo/config.toml и не коммитит.
