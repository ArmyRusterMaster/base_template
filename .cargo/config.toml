[build]
# Пустая строка ОТКЛЮЧАЕТ rustc-wrapper из глобального ~/.cargo/config.toml.
# Причина: sccache 0.17 падает с "failed to spawn rustc.exe" на web-sys
# (гигантская командная строка компилятора на Windows).
rustc-wrapper = ""

# --- Настройки для Linux ---
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld", # Используем быстрый линкер LLD
    "-C", "target-cpu=native"      # Максимальная оптимизация под текущий процессор
]

# --- Настройки для Windows (если разрабатываете на ней) ---
[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "link-arg=-fuse-ld=lld", # Используем быстрый линкер LLD
    "-C", "target-cpu=native"      # Максимальная оптимизация под текущий процессор
]