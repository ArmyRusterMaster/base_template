# ======================================================================
# Конфигурация приложения (base_template)
# Источники (от слабого к сильному):
#   1. default'ы из src/config.rs
#   2. этот файл
#   3. переменные окружения APP_* (см. docs/configuration.md, .env.example)
# Секции с неизвестными ключами — ошибка (deny_unknown_fields).
# ======================================================================

# Имя приложения (используется в логах).
app_name: "base_template"

server:
  # IP для слушания. Локально: 127.0.0.1. В Docker/CI: 0.0.0.0.
  host: "127.0.0.1"
  # Порт HTTP-сервера.
  port: 3000